# monitor-matrix (Next.js on 127.0.0.1:3003)
# Installed as /etc/nginx/sites-available/monitor.vnpromotion.com (symlinked into sites-enabled)

# HTTP: redirect everything to HTTPS (certbot's nginx plugin handles renewals itself)
server {
    listen 80;
    listen [::]:80;
    server_name monitor.vnpromotion.com;

    location / {
        return 301 https://monitor.vnpromotion.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name monitor.vnpromotion.com;

    ssl_certificate     /etc/letsencrypt/live/monitor.vnpromotion.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/monitor.vnpromotion.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Price file uploads in Quản trị (the app itself caps files at 5 MB)
    client_max_body_size 8m;

    # Internal tool: keep it out of search engines even if a link leaks
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Real visitor IP behind Cloudflare (https://www.cloudflare.com/ips/), used by the login throttle
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Next sends s-maxage=1y even on a 404; a missing build file must never be cached by Cloudflare
    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 = @monitor_static_missing;
    }
    location @monitor_static_missing {
        add_header Cache-Control "no-store" always;
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}

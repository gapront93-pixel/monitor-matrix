# Push to main: check and build on GitHub, then ship the build to the VPS (scripts/deploy.sh --ci).
# The VPS has 2GB RAM shared by every app, so it never builds; see docs/deploy.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in push order
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Build at the same absolute path as the VPS so the output runs there unchanged
  APP_DIR: /var/www/monitor-matrix

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: /var/www/monitor-matrix
    steps:
      - uses: actions/checkout@v5
        with:
          path: src-checkout

      - name: Chuẩn bị thư mục /var/www/monitor-matrix
        working-directory: .
        run: |
          sudo mkdir -p "$APP_DIR"
          sudo chown "$USER" "$APP_DIR"
          cp -a src-checkout/. "$APP_DIR"/

      - uses: actions/setup-node@v5
        with:
          node-version-file: src-checkout/.nvmrc
          cache: npm
          cache-dependency-path: src-checkout/package-lock.json

      - name: Cài thư viện
        run: npm ci --no-audit --no-fund

      - name: Prisma generate
        run: npm run db:generate

      - name: Kiểm tra TypeScript
        # Route types are generated by Next; a fresh checkout has none yet
        run: |
          npx next typegen
          npm run typecheck

      - name: Kiểm tra lint
        run: npm run lint

      - name: Test
        run: npm test --silent

      - name: Build
        # Secrets are read at runtime from the VPS .env; the build needs none of them
        env:
          SKIP_BUILD_TYPECHECK: "1"
          NEXT_TELEMETRY_DISABLED: "1"
          DATABASE_URL: postgresql://build:build@127.0.0.1:1/build
          SESSION_SECRET: build-only-not-used-at-runtime
        run: |
          short=${GITHUB_SHA:0:7}
          NEXT_DIST_DIR=".next-$short" npm run build
          tar -czf "$RUNNER_TEMP/build.tgz" --exclude="./.next-$short/cache" "./.next-$short"
          ls -lh "$RUNNER_TEMP/build.tgz"

      - name: Deploy lên VPS
        env:
          SSH_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS: deploy@157.66.24.196
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 \
            "$VPS" "deploy $GITHUB_SHA" < "$RUNNER_TEMP/build.tgz"

/* Layout: one dark trading-screen grid, sticky SKU column and retailer header, toolbar above */
:root{

h1{font-size:18px;font-weight:700;margin:0;letter-spacing:.01em;text-wrap:balance}

.stamp{color:var(--muted);font-size:12px}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.toolbar input,.toolbar select{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);padding:6px 8px;min-width:0}
.toolbar input[type=search]{flex:1 1 220px;max-width:340px}

.legend{color:var(--muted);font-size:12px;display:flex;gap:14px;flex-wrap:wrap;margin-left:auto}

:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.wrap{overflow:auto;max-height:calc(100vh - 150px);border:1px solid var(--line)}
table{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;width:max-content;min-width:100%}

thead th.key{color:var(--key)}
thead th .arr{color:var(--muted);font-size:10px}
tbody tr:nth-child(odd) td{background:var(--row-a)}
tbody tr:nth-child(even) td{background:var(--row-b)}
td.sku{position:sticky;left:0;z-index:1;font-weight:600;white-space:normal;max-width:240px;line-height:1.3}
td.sku a{color:inherit;text-decoration:none}
td.sku a:hover{text-decoration:underline}
td.sku small{display:block;color:var(--muted);font-weight:400;font-size:11px;margin-top:2px}
tbody tr.sel td{background:var(--sel)!important;color:#fff}
tbody tr.sel td small,tbody tr.sel td.p a{color:#fff}
td.p{font-family:var(--f-num);font-size:12px;text-align:center}
td.p a{color:var(--fg);text-decoration:none}
td.p a:hover{text-decoration:underline}
td.p.best a,td.p.best span{color:var(--best);font-weight:600}
td.p.best{box-shadow:inset 0 0 0 999px var(--best-bg)}
td.p.oos a,td.p.oos span{color:var(--muted);text-decoration:line-through}
td.p.dl a,td.p.dl span{color:var(--muted);font-style:italic}
td.p .tag{display:block;color:var(--warn);font-family:var(--f-ui);font-size:10px}
td.p .na{color:var(--warn);font-family:var(--f-ui);font-size:11px}
td.sum{font-family:var(--f-num);font-size:12px;text-align:right;color:var(--head)}
td.cnt{text-align:center;color:var(--muted)}
.empty{padding:24px;color:var(--muted)}
.note{color:var(--muted);font-size:12px;margin-top:10px;max-width:80ch;line-height:1.5}
.spec td{font-size:12px}
.spec td.n{font-family:var(--f-num);text-align:right}
.pill{display:inline-block;padding:1px 6px;border:1px solid var(--line);font-size:11px;color:var(--head)}
@media (max-width:600px){.legend{margin-left:0}nav.tabs{margin-left:0}.wrap{max-height:none}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

const R = DATA.retailers, M = DATA.models;

uniq(M.map(m=>m.size)).sort((a,b)=>a-b).forEach(v=>$('#f-size').add(new Option(v+'"',v)));
let sortKey = 'default', sortDir = 1, selected = null;
const minP = m => { const v = Object.values(m.prices).filter(x=>!x.o&&!x.d).map(x=>x.p).filter(Boolean); return v.length?Math.min(...v):null; };
const cnt = m => Object.values(m.prices).filter(x=>x.p&&!x.o&&!x.d).length;
function filtered(){
  const q = $('#q').value.trim().toLowerCase(), pn = $('#f-panel').value, sz = $('#f-size').value, has = $('#f-has').checked;
  return M.filter(m => (!q || (m.model+' '+m.panel+' '+m.hz+'hz '+m.res).toLowerCase().includes(q))
    && (!pn || m.panel===pn) && (!sz || m.size===sz) && (!has || Object.values(m.prices).some(x=>x.p)));
}
function sorted(list){
  if(sortKey==='default') return list;
  const val = m => sortKey==='min'?minP(m):sortKey==='cnt'?cnt(m):sortKey==='sku'?m.model:(m.prices[sortKey]?.p ?? null);
  return [...list].sort((a,b)=>{const x=val(a),y=val(b); if(x==null&&y==null)return 0; if(x==null)return 1; if(y==null)return -1; return (x>y?1:x<y?-1:0)*sortDir;});
}
function th(key,label,cls=''){ const a = sortKey===key?(sortDir>0?' ▲':' ▼'):''; return `<th class="${cls}" data-k="${key}">${label}<span class="arr">${a}</span></th>`; }
function renderGia(){
  const list = sorted(filtered());

const SPEC_COLS = [['model','Mẫu'],['series','Dòng'],['size','Inch'],['panel','Tấm nền'],['res','Độ phân giải'],['hz','Hz'],['rt','Phản hồi (ms)'],['sdr','Sáng SDR (nit)'],['hdrp','Sáng HDR (nit)'],['p3','DCI-P3 %'],['hdr','Chuẩn HDR'],['hdmi','HDMI'],['dp','DP'],['pd','USB-C PD (W)'],['h','Nâng hạ (mm)'],['pivot','Xoay dọc'],['min','Giá thấp nhất']];
function renderSpecs(){
  const list = sorted(filtered());
  $('#t-specs thead').innerHTML = '<tr>'+SPEC_COLS.map(([k,l],i)=>`<th class="${i===0?'sku':''}" data-k="${k==='model'?'sku':k==='min'?'min':'default'}">${l}</th>`).join('')+'</tr>';
  $('#t-specs tbody').innerHTML = list.map(m=>{const lo=minP(m); return '<tr>'+SPEC_COLS.map(([k])=>{
    if(k==='model') return `<td class="sku"><a href="${m.url}" target="_blank" rel="noopener">${m.model}</a></td>`;
    if(k==='min') return `<td class="n">${lo?fmt(lo):''}</td>`;
    if(k==='series') return `<td><span class="pill">${m.series}</span></td>`;
    const v = m[k]??''; return `<td class="${/^[\d.]+$/.test(v)?'n':''}">${v}</td>`;}).join('')+'</tr>';}).join('');
}

function render(){ view==='gia'?renderGia():renderSpecs(); }
function setView(v){ view=v; $('#view-gia').hidden=v!=='gia'; $('#view-specs').hidden=v!=='specs';

document.addEventListener('click',e=>{
  const h=e.target.closest('th[data-k]'); if(h){const k=h.dataset.k; if(k==='default')return; sortDir = sortKey===k?-sortDir:1; sortKey=k; render(); return;}
  const tr=e.target.closest('#t-gia tbody tr[data-s]'); if(tr && !e.target.closest('a')){ selected = selected===tr.dataset.s?null:tr.dataset.s; renderGia(); }
});

let v0='gia'; try{v0=localStorage.getItem('mm-view')||'gia'}catch(e){}
if(location.hash==='#specs') v0='specs';
setView(v0);
